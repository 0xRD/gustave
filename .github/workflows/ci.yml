name: CI

# Nothing runs twice: a pull request is checked once, main once after the merge, and tags
# and text-only changes not at all. A newer push to the same branch cancels the run it
# replaces.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      # Pinned by commit, for the same reason Gustave has no dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check.sh
      - run: scripts/build-app.sh
        env:
          GUSTAVE_SIGN_IDENTITY: "-"
      - run: scripts/verify.sh --ci
